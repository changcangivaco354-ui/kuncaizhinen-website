<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Company Profile | KUNCAIZHINEN</title><style>
:root{--ink:#14372c;--paper:#fbfaf6;--cream:#f1ede3;--line:#d7ded7;--serif:Georgia,serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}a{color:inherit}.nav{min-height:70px;display:flex;align-items:center;justify-content:space-between}.company-hero{padding:90px 6vw 60px;background:#dfe9df}.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:10px;font-weight:bold}.company-hero h1{font:500 clamp(48px,7vw,82px)/1 var(--serif);margin:18px 0}.company-tabs{display:flex;gap:10px;padding:22px 6vw;background:#fff;border-bottom:1px solid var(--line)}.company-tabs a{padding:12px 18px;border:1px solid var(--line);border-radius:999px;text-decoration:none}.company-tabs a.active{background:var(--ink);color:#fff}.content{padding:75px 6vw 100px;display:grid;grid-template-columns:.8fr 1.2fr;gap:7vw}.copy h2{font:48px var(--serif);margin-top:0}.copy p{font-size:17px;line-height:1.9;color:#52685d}.contact-list{margin-top:35px;border-top:1px solid var(--line)}.contact-list div{padding:17px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:110px 1fr;gap:20px}.contact-list b{font-size:10px;text-transform:uppercase;letter-spacing:.12em}.media{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.media img,.media video{width:100%;min-height:260px;height:100%;object-fit:cover;background:#e8ece7}.media .placeholder{min-height:280px;display:grid;place-items:center;border:1px dashed #9aaca0;color:#6a7d71;text-align:center;padding:30px}@media(max-width:800px){.content{grid-template-columns:1fr}.media{grid-template-columns:1fr}}
</style></head><body><header class="nav"></header><main><section class="company-hero"><p class="eyebrow">Company profile</p><h1 id="page-title">Company Introduction</h1></section><nav class="company-tabs"><a id="about-tab" href="/company.html?section=about">Company Introduction</a><a id="contact-tab" href="/company.html?section=contact">Contact Us</a></nav><section class="content"><div class="copy" id="copy"></div><div class="media" id="media"></div></section></main><script>
const esc=(v='')=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function load(){const section=new URLSearchParams(location.search).get('section')==='contact'?'contact':'about';document.querySelector('#'+section+'-tab').classList.add('active');const data=await(await fetch('/company.json',{cache:'no-store'})).json(),item=data[section];document.title=item.title+' | KUNCAIZHINEN';document.querySelector('#page-title').textContent=item.title;let contacts='';if(section==='contact')contacts=`<div class="contact-list"><div><b>Email</b><a href="mailto:${esc(item.email)}">${esc(item.email)}</a></div><div><b>WhatsApp</b><a href="https://wa.me/14085811840">${esc(item.whatsapp)}</a></div><div><b>Address</b><span>${esc(item.address)}</span></div></div>`;document.querySelector('#copy').innerHTML=`<h2>${esc(item.title)}</h2><p>${esc(item.text).replace(/\n/g,'<br>')}</p>${contacts}`;const images=item.images||[],videos=item.videos||[];document.querySelector('#media').innerHTML=images.map(src=>`<img src="${esc(src)}" alt="${esc(item.title)}">`).join('')+videos.map(src=>`<video src="${esc(src)}" controls preload="metadata"></video>`).join('')||'<div class="placeholder">Photos and videos can be added from the management panel.</div>'}load();
</script><script src="/languages.js"></script></body></html>
