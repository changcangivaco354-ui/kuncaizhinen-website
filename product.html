<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | KUNCAIZHINEN</title><style>
:root{--ink:#14372c;--paper:#fbfaf6;--cream:#f1ede3;--line:#d7ded7;--serif:Georgia,serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}a{color:inherit;text-decoration:none}.nav{height:82px;padding:0 6vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:.12em}.back{font-size:13px;font-weight:bold}.hero{display:grid;grid-template-columns:1fr 1fr;min-height:650px}.main-image{background:#e7ebe3;display:grid;place-items:center;padding:6vw}.main-image img{width:100%;height:520px;object-fit:contain;mix-blend-mode:multiply}.copy{padding:9vw 7vw}.category{text-transform:uppercase;letter-spacing:.16em;font-size:10px;font-weight:bold}.copy h1{font:500 clamp(48px,6vw,78px)/.98 var(--serif);letter-spacing:-.04em;margin:25px 0}.summary{font:25px/1.35 var(--serif);color:#6a8158}.description{line-height:1.8;color:#52685d}.facts{margin:38px 0;border-top:1px solid var(--line)}.fact{display:grid;grid-template-columns:120px 1fr;gap:20px;padding:16px 0;border-bottom:1px solid var(--line);font-size:13px}.fact b{text-transform:uppercase;letter-spacing:.1em;font-size:10px}.btn{display:inline-block;background:var(--ink);color:white;padding:17px 24px;font-weight:bold;font-size:13px}.gallery{padding:90px 6vw;background:var(--cream)}.gallery h2{font:52px var(--serif)}.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.gallery-grid img{width:100%;height:420px;object-fit:contain;background:white}.empty{padding:100px 6vw;text-align:center}.empty h1{font:52px var(--serif)}@media(max-width:750px){.hero{grid-template-columns:1fr}.main-image img{height:380px}.copy{padding:65px 6vw}.gallery-grid{grid-template-columns:1fr}}
</style></head><body><header class="nav"><a class="brand" href="/">KUNCAIZHINEN</a><a class="back" href="/">&larr; Back to products</a></header><main id="product"><div class="empty"><h1>Loading product…</h1></div></main><script>
const esc=(v='')=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function load(){const slug=new URLSearchParams(location.search).get('slug');const response=await fetch('/products.json',{cache:'no-store'});const products=(await response.json()).products||[];const p=products.find(item=>item.slug===slug);const root=document.querySelector('#product');if(!p){root.innerHTML='<div class="empty"><h1>Product not found</h1><p><a href="/">Return to product portfolio</a></p></div>';return}document.title=p.name+' | KUNCAIZHINEN';const gallery=(p.gallery||[p.mainImage]).map(src=>`<img src="${esc(src)}" alt="${esc(p.name)} product detail">`).join('');root.innerHTML=`<section class="hero"><div class="main-image"><img src="${esc(p.mainImage)}" alt="${esc(p.name)}"></div><div class="copy"><p class="category">${esc(p.category)}</p><h1>${esc(p.name)}</h1><p class="summary">${esc(p.summary)}</p><p class="description">${esc(p.description)}</p><div class="facts"><div class="fact"><b>Formats</b><span>${esc(p.formats)}</span></div><div class="fact"><b>Service</b><span>${esc(p.service)}</span></div></div><a class="btn" href="mailto:changcangivaco354@gmail.com?subject=${encodeURIComponent('Inquiry: '+p.name)}">Request a Quote &nearr;</a></div></section><section class="gallery"><h2>Product details</h2><div class="gallery-grid">${gallery}</div></section>`}load().catch(()=>{document.querySelector('#product').innerHTML='<div class="empty"><h1>Unable to load product</h1></div>'});
</script></body></html>
