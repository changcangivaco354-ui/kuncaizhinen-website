<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KUNCAIZHINEN Website Management</title>
</head>
<body>
<script>window.CMS_MANUAL_INIT = true;</script>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="https://unpkg.com/decap-cms@^3.8.0/dist/decap-cms.js"></script>
<script>
const categoryOptions = [
  { label: 'Hard Capsules', value: 'hard-capsules' },
  { label: 'Gummies', value: 'gummies' },
  { label: 'Softgels', value: 'softgels' },
  { label: 'Liquid Drops', value: 'liquid-drops' },
  { label: 'Powder Supplements', value: 'powder-supplements' },
  { label: 'Effervescent Tablets', value: 'effervescent-tablets' },
  { label: 'Chewable / Swallow Tablets', value: 'chewable-swallow-tablets' },
  { label: 'Shilajit Resin', value: 'shilajit-resin' },
  { label: 'Chinese Herbal Slices', value: 'herbal-slices' },
  { label: 'Herbal Beverages', value: 'herbal-beverages' }
];

const mediaFields = [
  { label: 'Photos', name: 'images', widget: 'list', required: false,
    field: { label: 'Photo', name: 'image', widget: 'image' } },
  { label: 'Videos', name: 'videos', widget: 'list', required: false,
    field: { label: 'Video file', name: 'video', widget: 'file' } }
];

CMS.init({
  config: {
    load_config_file: false,
    backend: { name: 'git-gateway', branch: 'main' },
    media_folder: 'uploads',
    public_folder: '/uploads',
    collections: [
      {
        name: 'catalog',
        label: 'Product Management',
        files: [
          {
            name: 'products',
            label: 'Products',
            file: 'products.json',
            format: 'json',
            fields: [
              {
                label: 'Product List',
                name: 'products',
                widget: 'list',
                summary: '{{fields.name}}',
                fields: [
                  { label: 'URL name (English, no spaces)', name: 'slug', widget: 'string', hint: 'Example: collagen-peptide-drink' },
                  { label: 'Product name', name: 'name', widget: 'string' },
                  { label: 'Product category', name: 'categorySlug', widget: 'select', options: categoryOptions, required: false, default: 'herbal-beverages' },
                  { label: 'Display category name', name: 'category', widget: 'string', required: false },
                  { label: 'Short introduction', name: 'summary', widget: 'string' },
                  { label: 'Detailed introduction', name: 'description', widget: 'text' },
                  { label: 'Main product image', name: 'mainImage', widget: 'image' },
                  { label: 'Detail images', name: 'gallery', widget: 'list', required: false,
                    field: { label: 'Image', name: 'image', widget: 'image' } },
                  { label: 'Available formats', name: 'formats', widget: 'string', required: false },
                  { label: 'Manufacturing service', name: 'service', widget: 'string', required: false },
                  { label: 'Show on homepage', name: 'featured', widget: 'boolean', default: true }
                ]
              }
            ]
          }
        ]
      },
      {
        name: 'company',
        label: 'Company Profile',
        files: [
          {
            name: 'companyContent',
            label: 'Company Introduction and Contact',
            file: 'company.json',
            format: 'json',
            fields: [
              {
                label: 'Company Introduction',
                name: 'about',
                widget: 'object',
                fields: [
                  { label: 'Title', name: 'title', widget: 'string' },
                  { label: 'Text introduction', name: 'text', widget: 'text' },
                  ...mediaFields
                ]
              },
              {
                label: 'Contact Us',
                name: 'contact',
                widget: 'object',
                fields: [
                  { label: 'Title', name: 'title', widget: 'string' },
                  { label: 'Text introduction', name: 'text', widget: 'text' },
                  { label: 'Email', name: 'email', widget: 'string' },
                  { label: 'WhatsApp', name: 'whatsapp', widget: 'string' },
                  { label: 'Address', name: 'address', widget: 'text' },
                  ...mediaFields
                ]
              }
            ]
          }
        ]
      }
    ]
  }
});
</script>
</body>
</html>
