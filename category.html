<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products | KUNCAIZHINEN</title><style>
:root{--ink:#14372c;--paper:#fbfaf6;--line:#d7ded7;--serif:Georgia,serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}a{color:inherit;text-decoration:none}.nav{min-height:70px;display:flex;align-items:center;justify-content:space-between}.category-hero{padding:85px 6vw 55px;background:#e8efe6}.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:10px;font-weight:bold}.category-hero h1{font:500 clamp(46px,7vw,82px)/1 var(--serif);margin:18px 0}.category-hero p{max-width:680px;line-height:1.7;color:#526c60}.category-tabs{display:flex;gap:8px;overflow:auto;padding:22px 6vw;border-bottom:1px solid var(--line);background:#fff}.category-tabs a{white-space:nowrap;padding:10px 15px;border:1px solid var(--line);border-radius:999px;font-size:12px}.category-tabs a.active,.category-tabs a:hover{background:#14372c;color:#fff}.products{padding:65px 6vw 100px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{background:#fff;border:1px solid #e0e4df}.card img{width:100%;height:330px;object-fit:contain;background:#f6f7f3}.card div{padding:22px}.card span{font-size:9px;text-transform:uppercase;letter-spacing:.15em}.card h2{font:27px var(--serif);margin:12px 0}.card p{font-size:13px;line-height:1.65;color:#607369}.card strong{font-size:12px}.empty{padding:80px 20px;text-align:center;border:1px dashed #aebbb3;background:#fff}.empty h2{font:36px var(--serif)}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.category-hero{padding-top:55px}}
</style></head><body><header class="nav"></header><main><section class="category-hero"><p class="eyebrow">Product portfolio</p><h1 id="category-title">Products</h1><p>Explore representative products and private-label manufacturing formats. New products added in the management panel appear here automatically.</p></section><nav class="category-tabs" id="category-tabs" aria-label="Product categories"></nav><section class="products"><div class="grid" id="category-grid"></div></section></main><script>
const categories=[['all','All Products'],['hard-capsules','Hard Capsules'],['gummies','Gummies'],['softgels','Softgels'],['liquid-drops','Liquid Drops'],['powder-supplements','Powder Supplements'],['effervescent-tablets','Effervescent Tablets'],['chewable-swallow-tablets','Chewable / Swallow Tablets'],['shilajit-resin','Shilajit Resin'],['herbal-beverages','Herbal Beverages']];
const esc=(v='')=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const aliases={'Functional Beverage':'herbal-beverages','Herbal Beverage':'herbal-beverages','Herbal Beverages':'herbal-beverages','Hard Capsules':'hard-capsules','Gummies':'gummies','Softgels':'softgels','Liquid Drops':'liquid-drops','Powder Supplements':'powder-supplements','Effervescent Tablets':'effervescent-tablets','Chewable / Swallow Tablets':'chewable-swallow-tablets','Shilajit Resin':'shilajit-resin'};
async function load(){const params=new URLSearchParams(location.search),selected=params.get('category')||'all',query=(params.get('q')||'').toLowerCase();const label=(categories.find(x=>x[0]===selected)||categories[0])[1];document.title=label+' | KUNCAIZHINEN';document.querySelector('#category-title').textContent=query?'Search: '+params.get('q'):label;document.querySelector('#category-tabs').innerHTML=categories.map(([slug,name])=>`<a class="${slug===selected?'active':''}" href="/category.html?category=${slug}">${name}</a>`).join('');const response=await fetch('/products.json',{cache:'no-store'});let products=(await response.json()).products||[];products=products.filter(p=>(selected==='all'||p.categorySlug===selected||aliases[p.category]===selected)&&(!query||(p.name+' '+p.summary+' '+p.description).toLowerCase().includes(query)));const grid=document.querySelector('#category-grid');grid.innerHTML=products.length?products.map(p=>`<article class="card"><a href="/product.html?slug=${encodeURIComponent(p.slug)}"><img src="${esc(p.mainImage)}" alt="${esc(p.name)}"><div><span>${esc(p.category)}</span><h2>${esc(p.name)}</h2><p>${esc(p.summary)}</p><strong>View product details →</strong></div></a></article>`).join(''):`<div class="empty"><h2>No products yet</h2><p>This category is ready. Add products from the management panel whenever you are ready.</p></div>`}load();
</script><script src="/languages.js"></script></body></html>
